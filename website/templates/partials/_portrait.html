{% load i18n %}<figure class="photo photo--{{ format }}">{% if m.photo %}<img src="{{ m.photo.vignette }}"{% if m.photo.largeur and m.photo.hauteur %} width="{{ m.photo.largeur }}" height="{{ m.photo.hauteur }}"{% endif %} alt="{% blocktranslate with nom=m.nom %}Photo de {{ nom }}{% endblocktranslate %}" loading="lazy" decoding="async">{% else %}<span class="photo-initiales" aria-hidden="true">{% for mot in m.nom.split|slice:":2" %}{{ mot|slice:":1"|upper }}{% endfor %}</span>{% endif %}</figure>
