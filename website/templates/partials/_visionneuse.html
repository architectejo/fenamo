{% load i18n site_tags %}<div class="visionneuse" id="visionneuse" role="dialog" aria-modal="true" aria-label="{% translate 'Visionneuse de la galerie' %}" hidden>
  <div class="visionneuse-haut"><span class="chiffres" data-visionneuse-position>1 / 1</span><button type="button" class="bouton-icone bouton-icone--droite" data-visionneuse-fermer aria-label="{% translate 'Fermer la visionneuse' %}">{% icone "x" %}</button></div>
  <div class="visionneuse-image" data-visionneuse-image></div>
  <div class="visionneuse-bas"><button type="button" class="bouton-icone" data-visionneuse-precedent aria-label="{% translate 'Élément précédent' %}">{% icone "chevron-left" %}</button><p data-visionneuse-legende></p><button type="button" class="bouton-icone" data-visionneuse-suivant aria-label="{% translate 'Élément suivant' %}">{% icone "chevron-right" %}</button></div>
</div>
