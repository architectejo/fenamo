{% load i18n site_tags %}{% for l in language_links %}<li><a class="langue-choix" href="{{ l.url }}" hreflang="{{ l.code }}" lang="{{ l.code }}"{% if l.courant %} aria-current="true"{% endif %}><span class="langue-code">{{ l.code|upper }}</span><span><span class="langue-nom">{{ l.nom }}</span>{% if l.nom_fr %}<span class="langue-fr" lang="fr">{{ l.nom_fr }}</span>{% endif %}</span>{% icone "check" %}</a></li>{% endfor %}
