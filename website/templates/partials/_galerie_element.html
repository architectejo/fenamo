{% load i18n site_tags %}<li><button type="button" class="galerie-element{% if g.type == 'video' %} galerie-element--video{% endif %}" data-visionneuse data-legende="{{ g.legende }}"{% if g.type == 'video' %} data-video="{{ g.video.embed }}" aria-label="{% if g.legende %}{% blocktranslate with legende=g.legende %}Lire la vidéo : {{ legende }}{% endblocktranslate %}{% else %}{% translate 'Lire la vidéo' %}{% endif %}"{% else %} data-src="{{ g.image.url }}" aria-label="{% if g.legende %}{% blocktranslate with legende=g.legende %}Agrandir la photo : {{ legende }}{% endblocktranslate %}{% else %}{% translate 'Agrandir la photo' %}{% endif %}"{% endif %}><span class="galerie-miniature"><figure class="photo photo--1x1">{% if g.image %}<img src="{{ g.image.vignette }}"{% if g.image.largeur and g.image.hauteur %} width="{{ g.image.largeur }}" height="{{ g.image.hauteur }}"{% endif %} alt="" loading="lazy" decoding="async">{% else %}<div class="photo-vide">{% icone "circle-play" %}</div>{% endif %}</figure></span>{% if g.legende %}<span class="legende">{{ g.legende }}</span>{% endif %}</button></li>
