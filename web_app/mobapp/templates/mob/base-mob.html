{% load static i18n %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f2ed">
  <title>{% block titre %}{% endblock %} | FENAMO-RDC</title>
  <link rel="icon" href="{% static 'img/favicon.png' %}" type="image/png">
  <script src="{% static 'js/theme.js' %}"></script>
  <link rel="preload" href="{% static 'fonts/atkinson-hyperlegible-next-400.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'fonts/barlow-condensed-600.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <a class="aller-contenu" href="#contenu">{% translate "Aller au contenu" %}</a>
  <main class="mob{% block classe_main %}{% endblock %}" id="contenu">
    <header class="mob-tete{% block classe_tete %}{% endblock %}">
      <img src="{% static 'img/logo-48.webp' %}" width="40" height="40" alt="">
      <div><div class="menu-nom">FENAMO-RDC</div><div class="menu-devise">{% translate "Unité, Discipline et Progrès" %}</div></div>
    </header>
    {% block corps %}{% endblock %}
  </main>
</body>
</html>
