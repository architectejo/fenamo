{% extends 'base-site.html' %}
{% load static %}

{% block title %}Accueil{% endblock title %}

{% block bodysite %}

{% include './header.html' %}


<div class="page-section">
    <div class="container">
        <h1 class="text-center wow fadeInUp">Identification des associations membres</h1>
        <p class="{{classe}}">{{message}}</p>

        <form class="main-form" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            {{form.as_p}}

            <button type="submit" class="btn btn-primary mt-3 wow zoomIn">Sauvegarder</button>
        </form>
    </div>
</div> <!-- .page-section -->
{% include './footer.html' %}

{% endblock bodysite %}
