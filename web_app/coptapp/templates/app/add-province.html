{% extends 'base-app.html' %}

{% load static %}

{% block body %}

{% include './header.html' %}

<main id="main" class="main">

    <div class="pagetitle">
      <h1>Province</h1>
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'home' %}">Accueil</a></li>
          <li class="breadcrumb-item">Formulair</li>
          <li class="breadcrumb-item active">Ajout d'une province</li>
        </ol>
      </nav>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-12">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Ajouter une province</h5>
              <p class="{{classe}}">{{message}}</p>

              <!-- General Form Elements -->
              <form method="post">
                {% csrf_token %}
                <div class="row mb-3">
                  <label for="inputText" class="col-sm-2 col-form-label">Province:</label>
                  <div class="col-sm-10">
                    <input type="text" name="nom" class="form-control">
                  </div>
                </div>

                <div class="row mb-3">
                  <label for="inputText" class="col-sm-2 col-form-label">Sigle:</label>
                  <div class="col-sm-10">
                    <input type="text" name="sigle" class="form-control">
                  </div>
                </div>

                <div class="row mb-3">
                  <label class="col-sm-2 col-form-label">Sauvegarder:</label>
                  <div class="col-sm-10">
                    <button type="submit" class="btn btn-primary">Ajouter</button>
                  </div>
                </div>

              </form><!-- End General Form Elements -->

            </div>
          </div>

        </div>
      </div>
    </section>

  </main><!-- End #main -->

{% include './footer.html' %}

{% endblock body %}
