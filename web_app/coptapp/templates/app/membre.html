{% extends "base.html" %}
{% load i18n design %}{% comment %}
Fiche d'un membre (maquette fiche-membre.html). La vue membre_view fournit le contexte ; chaque bloc est un fragment dans coptapp/membres/partials/.
Formulaires : modale commune alimentée par des <template> de la page (POST ordinaire + CSRF, mêmes champs que l'écran hérité).
Colonne de droite (carte de membre, historique) : l'historique est un onglet tant que la carte n'est pas livrée (F-27).
{% endcomment %}
{% block titre %}{{ membre.nom|default:_("Membre") }} - FENAMO-RDC{% endblock %}
{% block contenu %}
<div hidden hx-history="false"></div>{# données personnelles : pas de copie de la page dans l'historique HTMX #}
{% if message and not erreurs_modifier %}<div class="u-mb-4">{% include "components/_erreur.html" with niveau="info" titre=message %}</div>{% endif %}

{% include "coptapp/membres/partials/_fiche_entete.html" %}
{% if membre.motif_renvoi and membre.etat != "actif" and membre.etat != "supprime" %}<div class="u-mb-4">{% if membre.etat == "renvoye" %}{% translate "Dossier renvoyé" as t_titre_renvoye %}{% else %}{% translate "Dossier reculé d'un cran" as t_titre_renvoye %}{% endif %}{% include "components/_erreur.html" with niveau="danger" icone="undo-2" titre=t_titre_renvoye texte=membre.motif_renvoi %}</div>{% endif %}

<div x-data="onglets('informations')" @keydown.arrow-right="cle($event)" @keydown.arrow-left="cle($event)" @keydown.home="cle($event)" @keydown.end="cle($event)">
  <div class="onglets" role="tablist" aria-label="{% translate 'Sections de la fiche' %}">
    <button type="button" role="tab" class="onglet" id="onglet-informations" data-onglet="informations" aria-controls="panneau-informations"
            :aria-selected="(actif === 'informations').toString()" :tabindex="actif === 'informations' ? 0 : -1" @click="choisir('informations')">{% translate "Identité" %}</button>
    {% if membre.qualite == 'PROPRIETAIRE' or membre.qualite == 'MOTARD ET PROPRIETAIRE' or peut_ajouter_engin and membre.qualite == 'MOTARD' %}
    <button type="button" role="tab" class="onglet" id="onglet-engins" data-onglet="engins" aria-controls="panneau-engins"
            :aria-selected="(actif === 'engins').toString()" :tabindex="actif === 'engins' ? 0 : -1" @click="choisir('engins')">{% translate "Engins" %}{% if nbrMoto %} <span class="nombre">{{ nbrMoto }}</span>{% endif %}</button>
    {% endif %}
    <button type="button" role="tab" class="onglet" id="onglet-famille" data-onglet="famille" aria-controls="panneau-famille"
            :aria-selected="(actif === 'famille').toString()" :tabindex="actif === 'famille' ? 0 : -1" @click="choisir('famille')">{% translate "Famille" %}{% if familles %} <span class="nombre">{{ familles|length }}</span>{% endif %}</button>
    {% if peut_attribuer_privileges %}{% if membre.is_user %}
    <button type="button" role="tab" class="onglet" id="onglet-roles" data-onglet="roles" aria-controls="panneau-roles"
            :aria-selected="(actif === 'roles').toString()" :tabindex="actif === 'roles' ? 0 : -1" @click="choisir('roles')">{% translate "Rôles" %}</button>
    {% endif %}{% endif %}
    {% if peut_voir_historique %}
    <button type="button" role="tab" class="onglet" id="onglet-historique" data-onglet="historique" aria-controls="panneau-historique"
            :aria-selected="(actif === 'historique').toString()" :tabindex="actif === 'historique' ? 0 : -1" @click="choisir('historique')">{% translate "Historique" %}</button>
    {% endif %}
    {% if membre.is_user and user.membreId == membre.id %}
    <button type="button" role="tab" class="onglet" id="onglet-securite" data-onglet="securite" aria-controls="panneau-securite"
            :aria-selected="(actif === 'securite').toString()" :tabindex="actif === 'securite' ? 0 : -1" @click="choisir('securite')">{% translate "Sécurité" %}</button>
    {% endif %}
  </div>

  <div role="tabpanel" id="panneau-informations" aria-labelledby="onglet-informations" x-show="actif === 'informations'">
    {% include "coptapp/membres/partials/_fiche_informations.html" %}
  </div>
  <div role="tabpanel" id="panneau-engins" aria-labelledby="onglet-engins" x-show="actif === 'engins'" x-cloak>
    {% include "coptapp/membres/partials/_fiche_engins.html" %}
  </div>
  <div role="tabpanel" id="panneau-famille" aria-labelledby="onglet-famille" x-show="actif === 'famille'" x-cloak>
    {% include "coptapp/membres/partials/_fiche_famille.html" %}
  </div>
  {% if peut_attribuer_privileges %}{% if membre.is_user %}
  <div role="tabpanel" id="panneau-roles" aria-labelledby="onglet-roles" x-show="actif === 'roles'" x-cloak>
    {% include "coptapp/membres/partials/_fiche_roles.html" %}
  </div>
  {% endif %}{% endif %}
  {% if peut_voir_historique %}
  <div role="tabpanel" id="panneau-historique" aria-labelledby="onglet-historique" x-show="actif === 'historique'" x-cloak>
    {% include "coptapp/membres/partials/_fiche_historique.html" %}
  </div>
  {% endif %}
  {% if membre.is_user and user.membreId == membre.id %}
  <div role="tabpanel" id="panneau-securite" aria-labelledby="onglet-securite" x-show="actif === 'securite'" x-cloak>
    <section class="panneau">
      <div class="panneau-tete"><h2>{% translate "Sécurité" %}</h2></div>
      <div class="panneau-corps pile">
        <p>{% translate "Le changement de mot de passe se fait depuis votre page de sécurité." %}</p>
        {% url 'securite' as url_securite %}
        {% include "components/_bouton.html" with libelle=_("Changer mon mot de passe") icone="key-round" href=url_securite variante="principal" %}
      </div>
    </section>
  </div>
  {% endif %}
</div>

{# Contenus des modales (recopiés dans la modale commune au clic, voir static/js/fenamo.js) #}
{% if peut_modifier %}
<template id="modale-modifier"{% if erreurs_modifier %} data-ouvrir{% endif %}>{% include "coptapp/membres/partials/_modale_modifier.html" with action_url=request.path multipart=True large=True libelle_envoi=_("Enregistrer le membre") nom_envoi="modifier" %}</template>
{% endif %}
{% if peut_demander_modification %}
<template id="modale-demande">{% include "coptapp/membres/partials/_modale_demande.html" with action_url=request.path libelle_envoi=_("Envoyer la demande") nom_envoi="envoyer" %}</template>
{% endif %}
{% if peut_attribuer_privileges %}{% if membre.is_user %}
<template id="modale-privileges">{% include "coptapp/membres/partials/_modale_privileges.html" with action_url=request.path libelle_envoi=_("Enregistrer les privilèges") nom_envoi="privilege" %}</template>
{% endif %}{% endif %}
{% if peut_ajouter_engin %}{% if membre.qualite == 'MOTARD' or membre.qualite == 'MOTARD ET PROPRIETAIRE' %}
{% url 'moto-attribution' membre.id as url_attribution %}
<template id="modale-attribuer">{% include "coptapp/membres/partials/_modale_attribuer.html" with action_url=url_attribution libelle_envoi=_("Attribuer l'engin") nom_envoi="moto" %}</template>
{% endif %}{% endif %}
{% endblock %}
